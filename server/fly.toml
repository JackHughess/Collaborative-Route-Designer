# fly.toml app configuration file generated for route-designer-collab on 2026-11-23T17:32:09-06:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'route-designer-collab'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '1234'

[http_service]
  internal_port = 1234
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
